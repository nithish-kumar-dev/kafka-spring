# Enable the H2 web dashboard
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Avoid colliding with an unrelated nginx already bound to 8080 on this machine
server.port=8082

# Configure your connection details
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# Tell Hibernate to automatically create your Student/Teacher tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Run data.sql after Hibernate creates the schema, not before
spring.jpa.defer-datasource-initialization=true

spring.security.user.name=sathish
spring.security.user.password=123
